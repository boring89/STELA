[package]
name = "kernel"
description = "The STELA kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The kernel's logic is a library, so that its pure parts (run queues,
# sleep lists, the initrd reader) have host unit tests; the binary is the
# entry point and the self tests.
[lib]
path = "src/lib.rs"
bench = false
doctest = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Run the built-in self tests at boot and exit QEMU with the result.
selftest = []

[dependencies]
abi = { path = "../abi" }
block = { path = "../block" }
drivers = { path = "../drivers" }
ehfs = { path = "../ehfs" }
elfload = { path = "../elfload" }
frame = { path = "../frame" }
net = { path = "../net" }

[lints]
workspace = true
