[workspace]
resolver = "3"
members = ["boot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["YuanChi Hsieh"]
repository = "https://github.com/boring89/STELA"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
