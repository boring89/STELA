[workspace]
resolver = "3"
members = [
    "abi",
    "block",
    "boot",
    "bootinfo",
    "drivers",
    "ehfs",
    "elfload",
    "net",
    "frame",
    "kernel",
    "sysimage",
    "user/libstela",
    "user/hello",
    "user/spin",
    "user/fault",
    "user/ipc_server",
    "user/ipc_client",
    "user/echo",
    "user/fstest",
    "user/proctest",
    "user/init",
    "user/shell",
    "user/toolbox",
    "user/windowserver",
    "user/terminal",
    "user/echo_win",
    "user/mouseion",
    "user/viewer",
    "user/ifconfig",
    "user/ping",
    "user/fetch",
    "user/tone",
    "user/bin",
    "user/hwinfo",
    "user/bench",
    "user/kalamos",
    "user/monitor",
    "user/periplus",
    "user/stress",
    "user/pkgcore",
    "user/pkg",
    "user/ime",
    "user/e1000u",
    "user/powerbox",
    "user/sandboxtest",
    "user/setup",
    "classic",
    "tools/ehfs",
    "tools/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["YuanChi Hsieh"]
repository = "https://github.com/boring89/STELA"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

# The host fuzzer (tools/fuzz, P11 K45): optimized, but overflow and
# debug checks stay on and a panic unwinds (it is caught and reported).
[profile.fuzz]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
overflow-checks = true
debug-assertions = true
