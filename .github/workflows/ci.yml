name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf python3
      - name: Install Rust toolchain
        # Any cargo call makes rustup install the toolchain, targets and
        # components pinned by rust-toolchain.toml (`rustup show` stopped
        # doing so in rustup 1.28).
        run: cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: make clippy
      - name: Test
        # Host unit tests, QEMU self tests (default and minimal CPU without
        # NX; keystrokes injected through QMP send-key; threads, user mode,
        # system calls and the initrd programs), and a framebuffer
        # screendump check after hello has run and a line was typed into
        # the echo loop. Builds the user programs and packs the initrd with
        # the runner's GNU tar. No KVM needed.
        run: make test
