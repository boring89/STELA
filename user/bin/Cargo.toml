[package]
name = "bin"
description = "STELA's command-line tools (Initrd:/bin/) and their shared library, cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Every tool is listed (no test harness: they are no_std programs).
autobins = false

[lib]
name = "cli"
path = "src/lib.rs"
bench = false

