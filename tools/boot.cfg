# STELA boot options (docs/p520.md section 3).
# One option per line; remove the "#" in front of an option to use it.
#
# textmode   no desktop: the shell on the text console
# nowindow   the same as textmode
# nousb      leave the USB (xHCI) controller alone
# nosmp      use only the first processor
# nonet      leave the network card alone
# system=a   start the System volume in slot a (or b); auto (the default)
#            follows STELA/slot on this partition (docs/system.md)
# verify     check the whole System image (its SHA-256) at every start
# serial     (reserved; the serial port is always on)
# classic=off  (reserved for the Classic environment)
