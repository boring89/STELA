name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        # mtools and gdisk (sgdisk) make the FAT and GPT test images.
        # gcc builds musl, the Linux test programs and the Classic
        # environment's C code; the m68k binutils assemble its 68k tests.
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf python3 mtools gdisk gcc binutils-m68k-linux-gnu
      - name: musl tarball
        # The Linux test programs are built with musl (MIT). Locally the
        # tarball is copied from where it already is; here it is fetched
        # once and cached, and the Makefile checks its SHA-256.
        uses: actions/cache@v4
        with:
          path: build-cache/musl-1.2.5.tar.gz
          key: musl-a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4
      - name: Fetch musl
        run: |
          mkdir -p build-cache
          test -f build-cache/musl-1.2.5.tar.gz || curl -fsSL -o build-cache/musl-1.2.5.tar.gz https://musl.libc.org/releases/musl-1.2.5.tar.gz
          echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  build-cache/musl-1.2.5.tar.gz" | sha256sum -c -
          echo "MUSL_TARBALL=$PWD/build-cache/musl-1.2.5.tar.gz" >> "$GITHUB_ENV"
      - name: libchewing tarball
        # The IME's engine (LGPL-2.1-or-later, docs/ime.md): fetched once
        # and cached; the Makefile checks its SHA-256.
        uses: actions/cache@v4
        with:
          path: build-cache/libchewing-0.5.1.tar.bz2
          key: libchewing-9708c63415fa6034435c0f38100e7d30d0e1bac927f67bec6dfeb3fef016172b
      - name: Fetch libchewing
        run: |
          mkdir -p build-cache
          test -f build-cache/libchewing-0.5.1.tar.bz2 || curl -fsSL -o build-cache/libchewing-0.5.1.tar.bz2 https://github.com/chewing/libchewing/releases/download/v0.5.1/libchewing-0.5.1.tar.bz2
          echo "9708c63415fa6034435c0f38100e7d30d0e1bac927f67bec6dfeb3fef016172b  build-cache/libchewing-0.5.1.tar.bz2" | sha256sum -c -
          echo "CHEWING_TARBALL=$PWD/build-cache/libchewing-0.5.1.tar.bz2" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        # Any cargo call makes rustup install the toolchain, targets and
        # components pinned by rust-toolchain.toml (`rustup show` stopped
        # doing so in rustup 1.28).
        run: cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: make clippy
      - name: Test
        # Host unit tests, QEMU self tests (default and minimal CPU without
        # NX; keystrokes injected through QMP send-key; threads, user mode,
        # system calls, the initrd programs, ports and the IPC test
        # programs, PCI, AHCI and NVMe disks, GPT, FAT and eHFS volumes over
        # two boots, processes, the Linux personality), a framebuffer
        # screendump check after a command was typed into the shell, a
        # scripted shell session (on two processors), shutdown and reboot,
        # the static musl test programs run from the shell; P10: boot
        # options, the disk image, networking on three cards (slirp and a
        # local HTTP server), sound recorded to a WAV file, and the self
        # tests on four processors.
        # Builds the user programs and packs the initrd with
        # the runner's GNU tar. No KVM needed.
        run: make test
