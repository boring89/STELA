[package]
name = "pkgcore"
description = "STELA's package logic: the signed index, ustar packages, what is installed (pkg, Setup.app)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
libstela = { path = "../libstela" }
# Index signatures (P12, docs/pkg.md, third_party/README.md).
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
